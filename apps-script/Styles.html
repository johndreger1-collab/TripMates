<style>
:root {
  --bg: #f4f4f0; --fg: #15181a; --muted: #4f565c; --card: #ffffff; --line: #c4c8cc;
  --accent: #0b5d3b; --accent-fg: #ffffff; --warn: #7a4e00; --fail: #b3261e; --ok: #0f6b2f;
  --tone-unrated: #9aa0a6; --tone-red: #d93025; --tone-amber: #f9ab00;
  --tone-lgreen: #7bc67e; --tone-dgreen: #137333; --tone-anchor: #37474f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101312; --fg: #eef1ef; --muted: #aab2b4; --card: #1b1f1e; --line: #3b4240;
    --accent: #5cc690; --accent-fg: #05220f; --warn: #f2c46b; --fail: #ff8f86; --ok: #78d894;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body.noscroll { overflow: hidden; }
h1 { font-size: 19px; margin: 0; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 14px; }
.pad { padding: 14px; }

/* ---------- layout ---------- */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.appbar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; background: var(--card);
  border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; }
.appbar .title { flex: 1; min-width: 0; }
.appbar .muted { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screens { flex: 1; min-height: 0; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tabs { display: flex; flex: 0 0 auto; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; min-height: 56px; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

/* ---------- controls ---------- */
.btn { min-height: 48px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent);
  color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
  justify-content: center; text-decoration: none; text-align: center; }
.btn.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.big { min-height: 56px; width: 100%; font-size: 17px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .fchip:focus-visible,
.tab:focus-visible, .row-item:focus-visible, .seg button:focus-visible, .numpick button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.btn-row .btn { flex: 1 1 140px; }
input[type=text], input[type=url], input[type=number], input[type=date], input[type=datetime-local], textarea, select {
  width: 100%; min-height: 48px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg); font: inherit; margin: 4px 0 0; }
textarea { min-height: 88px; }
label, .label { font-size: 14px; font-weight: 600; display: block; }
.field { margin: 0 0 14px; }

.chipbar { display: flex; gap: 6px; overflow-x: auto; flex: 0 0 auto; padding: 8px 10px; background: var(--bg);
  border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.fchip { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--card); color: var(--fg); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tagchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tagchips .fchip { min-height: 40px; font-size: 14px; }
.tag { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; margin: 0 4px 4px 0; }

.seg { display: flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0 0 10px; }
.seg button { flex: 1; min-height: 48px; border: 0; background: var(--card); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.numpick { display: flex; gap: 8px; margin-top: 6px; }
.numpick button { flex: 1; min-height: 48px; border-radius: 10px; border: 2px solid var(--line); background: var(--card);
  color: var(--fg); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
.numpick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.fabs { position: absolute; right: 12px; bottom: 16px; z-index: 1100; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.fab { min-height: 56px; padding: 0 20px; border-radius: 28px; border: 2px solid var(--accent); background: var(--accent);
  color: var(--accent-fg); font: inherit; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
.fab.secondary { background: var(--card); color: var(--fg); border-color: var(--line); }

/* ---------- map ---------- */
#map { flex: 1; min-height: 0; }
.add-map { height: 38vh; min-height: 240px; border-radius: 10px; border: 1px solid var(--line); margin: 8px 0 14px; }

/* ---------- list ---------- */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: 0 0 auto; border-bottom: 1px solid var(--line); background: var(--card); }
.toolbar label { margin: 0; white-space: nowrap; }
.toolbar select { margin: 0; width: auto; flex: 1; }
.listwrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.row-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 8px 12px; border: 0;
  border-bottom: 1px solid var(--line); background: var(--card); color: var(--fg); text-align: left; font: inherit; cursor: pointer; }
.row-item .grow { flex: 1; min-width: 0; }
.row-item .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-item .sub { font-size: 13px; color: var(--muted); }
.row-item .walk { font-size: 14px; font-weight: 600; white-space: nowrap; }
.badge { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
.badge.sq { border-radius: 8px; }
.t-unrated { background: var(--tone-unrated); color: #111; } .t-red { background: var(--tone-red); color: #fff; }
.t-amber { background: var(--tone-amber); color: #111; } .t-lgreen { background: var(--tone-lgreen); color: #111; }
.t-dgreen { background: var(--tone-dgreen); color: #fff; } .t-anchor { background: var(--tone-anchor); color: #fff; }
.status { display: inline-block; padding: 1px 9px; border: 2px solid currentColor; border-radius: 999px; font-size: 12px; font-weight: 700; }
.s-Want { color: var(--muted); } .s-Been { color: var(--ok); } .s-Skipped { color: var(--warn); }
.flag { color: var(--warn); font-weight: 700; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

/* ---------- place card ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80vh; max-height: 80dvh; overflow-y: auto; z-index: 1500;
  background: var(--card); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.3);
  padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; gap: 10px; align-items: flex-start; }
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head h2 { overflow-wrap: anywhere; }
.scorebox { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
.card-block { margin: 12px 0; }
.warnline { color: var(--warn); font-weight: 600; }

/* ---------- add place ---------- */
.overlay { position: fixed; inset: 0; z-index: 1600; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px)); }
.add-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.add-msg { min-height: 1.4em; font-size: 14px; margin: 8px 0 0; }
.add-msg.err { color: var(--fail); font-weight: 600; }
.sticky-save { position: sticky; bottom: 0; padding: 10px 0 0; background: linear-gradient(transparent, var(--bg) 30%); }

/* ---------- rating screen and ratings on the card ---------- */
.rate-crit { margin: 0 0 16px; }
.rate-crit .muted { margin: 2px 0 0; }
.ratepick { display: flex; gap: 6px; margin-top: 6px; }
.ratepick button { flex: 1 1 0; min-width: 0; min-height: 52px; padding: 0 2px; border-radius: 10px; border: 2px solid var(--line);
 background: var(--card); color: var(--fg); font: inherit; font-size: 14px; font-weight: 700; line-height: 1.15; cursor: pointer; }
.ratepick button.skip { color: var(--muted); font-weight: 600; }
.ratepick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ratepick button.skip[aria-pressed="true"] { background: var(--line); border-color: var(--muted); color: var(--fg); }
.ratepick button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.livescore { font-weight: 700; font-size: 17px; margin: 0 0 8px; padding-top: 6px; }
.ratingline { padding: 6px 0; border-bottom: 1px solid var(--line); }
details.earlier summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--muted); font-weight: 600; }

/* ---------- Mine / Mate / Both bar ---------- */
.viewbar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: 6px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.viewbar span { font-size: 14px; font-weight: 600; white-space: nowrap; }
.viewbar .seg { flex: 1; min-width: 0; margin: 0; }
.viewbar .seg button { min-height: 44px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }

/* The same control inside the place card */
.sheet .viewbar { background: transparent; border-bottom: 0; padding: 4px 0 8px; }

/* ---------- Phase 4: check-in screen, tally, activity ---------- */
.row-item[aria-pressed="true"] { background: var(--line); box-shadow: inset 5px 0 0 var(--accent); }
.activity { list-style: none; padding: 0; margin: 6px 0 0; }
.activity li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ytally { font-weight: 700; margin: 4px 0 2px; }
.sync-note { margin: 10px 0 0; }

/* ---------- Phase 5: route ---------- */
.route-top { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); }
.route-top select, .route-top input[type=text] { flex: 1; min-width: 0; margin: 0; }
.route-top .btn { flex: 0 0 auto; }
.route-map { flex: 0 0 auto; height: 36vh; min-height: 220px; border-bottom: 1px solid var(--line); }
.route-caption { margin: 0; padding-top: 8px; padding-bottom: 0; }
.route-total { margin: 0; padding-bottom: 4px; }
.stop { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 12px 0; }
.stop.next { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.stop.done { opacity: .8; }
.stop-head { display: flex; align-items: center; gap: 10px; }
.stop-head .grow { flex: 1; min-width: 0; }
.stop-num { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
 font-weight: 700; background: var(--line); color: var(--fg); border: 2px solid var(--muted); }
.stop.next .stop-num { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.stop-name { font-weight: 700; overflow-wrap: anywhere; }
.next-flag { font-weight: 700; color: var(--accent); }
.stop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stop-actions .btn { min-height: 48px; flex: 1 1 120px; padding: 0 10px; }
.stop-actions .btn.icon { flex: 0 0 56px; font-size: 20px; }
.leg { margin: 0 12px; padding: 4px 0 0 28px; font-size: 14px; color: var(--muted); }
.rhythm { margin: 8px 12px 0; }

/* ---------- Phase 6: match day, get me home, trip tools ---------- */
.matchbar { flex: 0 0 auto; padding: 8px 12px; background: var(--accent); color: var(--accent-fg); font-size: 15px; }
.matchbar .muted { color: inherit; opacity: .85; margin: 2px 0 0; }
.homefab { position: fixed; left: 12px; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 1100; min-height: 52px; padding: 0 18px;
 border-radius: 26px; border: 2px solid var(--accent); background: var(--card); color: var(--fg); font: inherit; font-weight: 700;
 box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
.tag.hot { border-color: var(--warn); color: var(--warn); font-weight: 700; }
.listwrap, .scroll { padding-bottom: 84px; }
#trip-tools textarea { min-height: 120px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
#trip-tools input[type=file] { margin: 8px 0; max-width: 100%; }

/* ---------- misc ---------- */
.cardbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px; }
details.cardbox summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.members { list-style: none; padding: 0; margin: 6px 0 0; }
.members li { padding: 6px 0; border-bottom: 1px solid var(--line); }
#busy { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 3000; background: var(--accent); animation: busy 1.1s ease-in-out infinite; transform-origin: left; }
@keyframes busy { 0% { transform: scaleX(.05); } 50% { transform: scaleX(.7); } 100% { transform: scaleX(.05); transform-origin: right; } }
/* Top of the screen, so a message never covers the + Add place / Locate buttons or the tab bar. Taps pass through it. */
.toast { position: fixed; left: 12px; right: 12px; top: calc(76px + env(safe-area-inset-top, 0px)); padding: 14px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 3000; }
.toast.show { opacity: 1; } .toast.err { background: var(--fail); color: #fff; }
@media (prefers-reduced-motion: reduce) { #busy { animation: none; } .toast { transition: none; } }

/* ---------- app bar city picker ---------- */
.appbar select { width: auto; max-width: 40%; margin: 0; min-height: 44px; }
.appbar .btn { min-height: 44px; padding: 0 12px; }

/* ---------- Phase 7 ---------- */
/* Food nudge: a card-coloured banner with a thick warn edge, so it reads apart from the green match bar. */
.nudgebar { flex: 0 0 auto; padding: 8px 12px; background: var(--card); color: var(--fg); font-size: 15px;
  border-bottom: 1px solid var(--line); border-left: 6px solid var(--warn); }
.nudgebar strong { color: var(--warn); }
.nudgebar .btn-row { margin: 8px 0 2px; }
.nudgebar .btn-row .btn { flex: 1 1 90px; padding: 0 10px; }
/* Wind-down: Get me home turns solid and gains a ring; its text does not change. */
.homefab.wind { background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--accent), 0 2px 8px rgba(0,0,0,.35); }
</style>
